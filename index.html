<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMAU - De A a Z</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --azul: #1F2F5A; /* Azul oficial do logo */
  --laranja: #F77F00;
  --branco: #FFFFFF;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--azul);
  color: var(--branco);
  text-align: center;
}

.hero {
  padding: 100px 20px 80px;
}

.logo img {
  max-width: 420px;
  width: 90%;
  margin-bottom: 40px;
}

.hero h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 10px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 40px;
  opacity: 0.9;
}

.btn {
  display: inline-block;
  padding: 14px 32px;
  border-radius: 6px;
  font-weight: 700;
  text-decoration: none;
  margin: 10px;
  transition: 0.3s;
}

.btn-primary {
  background-color: var(--laranja);
  color: var(--azul);
}

.btn-primary:hover {
  opacity: 0.85;
}

.btn-outline {
  border: 2px solid var(--branco);
  color: var(--branco);
}

.btn-outline:hover {
  background-color: var(--branco);
  color: var(--azul);
}
</style>
</head>

<body>

<section class="hero">

<div class="logo">
  <img src="Simau_logo.png" alt="Simau Logo">
</div>

<h2>Você delega. A gente resolve.</h2>
<p>Obras, reformas e manutenção sem dor de cabeça.</p>

<a href="#" class="btn btn-primary">Solicitar Orçamento</a>
<a href="#" class="btn btn-outline">Ver Serviços</a>

</section>

</body>
</html>
